name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      passed-tests: ${{ steps.tests.outputs.passed_tests }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check and build frontend
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
      - name: Run frontend tests
        id: tests
        working-directory: .
        run: python scripts/run_frontend_tests.py --coverage
      - name: Measure main frontend coverage baseline
        working-directory: .
        run: |
          baseline="$RUNNER_TEMP/main-frontend-baseline"
          trap '[ -L "$baseline/frontend/node_modules" ] && rm -f "$baseline/frontend/node_modules"; git worktree remove --force "$baseline" 2>/dev/null || true' EXIT
          git worktree add --detach "$baseline" HEAD^1
          if cmp -s frontend/package-lock.json "$baseline/frontend/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$baseline/frontend/node_modules"
          else
            (cd "$baseline/frontend" && npm ci)
          fi
          (
            cd "$baseline/frontend"
            npx --no-install vitest run --coverage --coverage.reporter=json-summary --coverage.reportsDirectory="$RUNNER_TEMP/main-frontend-coverage"
          )
      - name: Check frontend coverage gate
        working-directory: .
        run: |
          python scripts/report_coverage.py frontend \
            --baseline "$RUNNER_TEMP/main-frontend-coverage/coverage-summary.json" \
            --diff-base HEAD^1 \
            --check
      - name: Upload frontend coverage report
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  backend:
    name: backend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      passed-tests: ${{ steps.tests.outputs.passed_tests }}
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      SKILLPROOF_ENV: development
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Check backend dependencies
        run: python -m pip check
      - name: Lint backend and scripts
        run: python -m ruff check backend scripts
      - name: Run backend tests
        id: tests
        env:
          SKILLPROOF_DB_PATH: ${{ runner.temp }}/skillproof-tests.sqlite3
        run: python -m coverage run scripts/run_backend_tests.py
      - name: Generate backend coverage reports
        id: coverage_reports
        run: |
          python -m coverage html -q
          python -m coverage json -q
      - name: Measure main backend coverage baseline
        run: |
          baseline="$RUNNER_TEMP/main-backend-baseline"
          baseline_venv="$RUNNER_TEMP/main-backend-venv"
          trap 'git worktree remove --force "$baseline" 2>/dev/null || true; rm -rf "$baseline_venv"' EXIT
          git worktree add --detach "$baseline" HEAD^1
          baseline_python="python"
          if ! cmp -s backend/requirements.txt "$baseline/backend/requirements.txt" || ! cmp -s backend/requirements-test.txt "$baseline/backend/requirements-test.txt"; then
            python -m venv "$baseline_venv"
            baseline_python="$baseline_venv/bin/python"
            "$baseline_python" -m pip install -r "$baseline/backend/requirements-test.txt"
          fi
          (
            cd "$baseline"
            PYTHONPATH="$baseline/backend" \
            SKILLPROOF_DB_PATH="$RUNNER_TEMP/skillproof-main-tests.sqlite3" \
            GITHUB_OUTPUT="" \
            "$baseline_python" -m coverage run --data-file="$RUNNER_TEMP/main-backend.coverage" scripts/run_backend_tests.py
            "$baseline_python" -m coverage json --data-file="$RUNNER_TEMP/main-backend.coverage" -o "$RUNNER_TEMP/main-backend-coverage.json" -q
          )
      - name: Check backend coverage gate
        run: |
          python scripts/report_coverage.py backend \
            --baseline "$RUNNER_TEMP/main-backend-coverage.json" \
            --diff-base HEAD^1 \
            --check
      - name: Upload backend coverage report
        if: ${{ !cancelled() && steps.coverage_reports.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: htmlcov/
          retention-days: 14
      - name: Start API and check health
        env:
          SKILLPROOF_DB_PATH: ${{ runner.temp }}/skillproof-health.sqlite3
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API exited before becoming ready" >&2
              exit 1
            fi
            if curl --fail --silent --max-time 1 http://127.0.0.1:8000/api/health > "$RUNNER_TEMP/health.json"; then
              python -c 'import json, sys; body = json.load(sys.stdin); sys.exit(0 if body == {"Status": "ok"} else f"Unexpected health response: {body!r}")' < "$RUNNER_TEMP/health.json"
              exit 0
            fi
            sleep 0.25
          done

          echo "API did not become ready within 10 minutes" >&2
          exit 1

  integration:
    name: integration-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      passed-tests: ${{ steps.tests.outputs.passed_tests }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend-backend integration tests
        id: tests
        run: python scripts/run_integration_tests.py

  qa:
    name: qa-checks
    needs: [frontend, backend, integration]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
      - name: Read current PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/skillproof-pr.json"
      - name: Check Issue registration against test results
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PASSED_TESTS: ${{ needs.backend.outputs.passed-tests }}
          FRONTEND_PASSED_TESTS: ${{ needs.frontend.outputs.passed-tests }}
          INTEGRATION_PASSED_TESTS: ${{ needs.integration.outputs.passed-tests }}
          PR_DETAILS: ${{ runner.temp }}/skillproof-pr.json
          CHANGED_FILES: ${{ runner.temp }}/skillproof-changed-files
        run: |
          git diff --name-only --no-renames -z HEAD^1 HEAD > "$CHANGED_FILES"
          python scripts/check_qa.py
